apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardrail.fullname" . }}-api
  labels:
    {{- include "guardrail.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "guardrail.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardrail.fullname" . }}-ui
  labels:
    {{- include "guardrail.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "guardrail.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - {name: http, port: {{ .Values.ui.service.port }}, targetPort: http}
{{- end }}
