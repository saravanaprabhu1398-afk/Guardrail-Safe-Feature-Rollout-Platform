{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guardrail.fullname" . }}-ui
  labels:
    {{- include "guardrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "guardrail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "guardrail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ include "guardrail.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 10001}
      containers:
        - name: ui
          image: {{ include "guardrail.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["guardrail-ui"]
          securityContext:
            {{- include "guardrail.containerSecurityContext" . | nindent 12 }}
          env:
            - name: GUARDRAIL_API_URL
              value: http://{{ include "guardrail.fullname" . }}-api:{{ .Values.api.service.port }}
            - {name: STREAMLIT_BROWSER_GATHER_USAGE_STATS, value: "false"}
          ports:
            - {name: http, containerPort: 8501, protocol: TCP}
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
