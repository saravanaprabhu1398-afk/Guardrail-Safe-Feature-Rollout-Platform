apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "guardrail.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "guardrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "guardrail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, fsGroup: 10001}
      containers:
        - name: migration
          image: {{ include "guardrail.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["guardrail-db-upgrade"]
          securityContext:
            {{- include "guardrail.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "guardrail.databaseEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
