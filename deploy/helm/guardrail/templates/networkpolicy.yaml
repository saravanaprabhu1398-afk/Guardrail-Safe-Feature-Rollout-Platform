{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guardrail.fullname" . }}-default
  labels:
    {{- include "guardrail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "guardrail.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8501}
{{- end }}
