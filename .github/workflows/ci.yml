name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contracts, tests, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://guardrail:guardrail-ci@localhost:5432/guardrail
      GUARDRAIL_POSTGRES_TEST_URL: postgresql+psycopg://guardrail:guardrail-ci@localhost:5432/guardrail
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: guardrail
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrail -d guardrail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Validate event-contract compatibility
        run: uv run pytest tests/test_event_contracts.py

      - name: Parse the dbt project without warehouse access
        env:
          DBT_SNOWFLAKE_ACCOUNT: ci-placeholder
          DBT_SNOWFLAKE_USER: ci-placeholder
          DBT_SNOWFLAKE_PAT: ci-placeholder
          DBT_SNOWFLAKE_ROLE: GUARDRAIL_ENGINEER
          DBT_SNOWFLAKE_WAREHOUSE: GUARDRAIL_TRANSFORM_WH
          DBT_SNOWFLAKE_DATABASE: GUARDRAIL
        run: >-
          uv run dbt parse
          --project-dir dbt_guardrail
          --profiles-dir dbt_guardrail

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Apply PostgreSQL migrations
        run: uv run guardrail-db-upgrade

      - name: Run complete test suite
        run: uv run pytest

      - name: Audit locked production dependencies
        run: >-
          uv export --frozen --no-dev --format requirements-txt --no-emit-project
          | uv run pip-audit --requirement /dev/stdin

      - name: Run deterministic end-to-end decision demos
        run: uv run guardrail-phase6-demo --scenario all

      - name: Validate Docker Compose
        run: docker compose --profile snowflake config --quiet

      - name: Lint production Helm chart
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          alpine/helm:4.2.3 lint deploy/helm/guardrail

      - name: Check Terraform formatting
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          hashicorp/terraform:1.15.8
          fmt -check -recursive infrastructure/terraform

  container:
    name: Build application container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag guardrail-platform:${{ github.sha }} .

      - name: Verify container runs as the unprivileged service account
        run: >-
          test "$(docker run --rm --entrypoint id guardrail-platform:${{ github.sha }} -u)"
          = "10001"

  release:
    name: Publish immutable application image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - quality
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize the GHCR image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the image for security validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: guardrail-release-scan:${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Reject fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: guardrail-release-scan:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          provenance: mode=max
          sbom: true

      - name: Sign and publish GitHub build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record the deployment artifact
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### Production image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
