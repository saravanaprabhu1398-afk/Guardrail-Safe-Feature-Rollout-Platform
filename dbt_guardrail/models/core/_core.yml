version: 2

models:
  - name: fct_experiment_assignments
    description: Event-grain assignment history used to resolve assignment state at exposure time.
    columns:
      - name: assignment_event_id
        data_tests: [not_null, unique]
      - name: experiment_id
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]
      - name: variant_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, treatment]
      - name: allocation_version
        data_tests: [not_null]
      - name: assignment_timestamp
        data_tests: [not_null]

  - name: fct_experiment_exposures
    description: >
      Event-grain exposures matched to the latest preceding assignment. Orphan and
      variant-mismatched events are retained but marked ineligible for metrics.
    columns:
      - name: exposure_event_id
        data_tests: [not_null, unique]
      - name: experiment_id
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]
      - name: variant_id
        data_tests: [not_null]
      - name: exposure_timestamp
        data_tests: [not_null]
      - name: is_eligible_exposure
        data_tests: [not_null]

  - name: fct_product_outcomes
    description: Event-grain conversion and guardrail outcomes prior to attribution.
    columns:
      - name: outcome_event_id
        data_tests: [not_null, unique]
      - name: outcome_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [order_completed, order_cancelled, payment_failed, delivery_completed]
      - name: outcome_timestamp
        data_tests: [not_null]

  - name: fct_attributed_outcomes
    description: >
      Outcomes attributed to the most recent eligible exposure in the configured
      event-time window. Exposure variant is authoritative for analysis.
    columns:
      - name: outcome_event_id
        data_tests: [not_null, unique]
      - name: exposure_event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_experiment_exposures')
                field: exposure_event_id
      - name: seconds_after_exposure
        data_tests: [not_null]

  - name: dim_users
    description: User identity rollup that makes cross-anonymous-identity behavior explicit.
    columns:
      - name: user_key
        data_tests: [not_null, unique]
      - name: user_id
        data_tests: [not_null, unique]

  - name: fct_user_sessions
    description: User-session grain behavioral summary across experiments.
    columns:
      - name: session_key
        data_tests: [not_null, unique]
      - name: user_id
        data_tests: [not_null]
      - name: session_id
        data_tests: [not_null]
