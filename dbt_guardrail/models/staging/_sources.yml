version: 2

sources:
  - name: clean
    description: Contract-valid, identity-deduplicated product telemetry.
    database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', 'GUARDRAIL') }}"
    schema: CLEAN
    config:
      loaded_at_field: FIRST_INGESTED_AT
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 7, period: day}
    tables:
      - name: product_events_deduplicated
        identifier: PRODUCT_EVENTS_DEDUPLICATED
        description: One canonical event per stable producer event_id.
        columns:
          - name: EVENT_ID
            data_tests: [not_null, unique]
          - name: EVENT_NAME
            data_tests: [not_null]
          - name: EVENT_TIMESTAMP
            data_tests: [not_null]
          - name: FIRST_INGESTED_AT
            data_tests: [not_null]
