events {}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8443 ssl;
        server_name gateway-prodtest localhost;

        ssl_certificate /certs/gateway.crt;
        ssl_certificate_key /certs/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        client_max_body_size 8m;

        location / {
            set $guardrail_backend guardrail-api-prodtest:8000;
            proxy_pass http://$guardrail_backend;
            proxy_http_version 1.1;
            proxy_set_header Host gateway-prodtest;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
